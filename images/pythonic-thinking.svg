<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .card-bad { fill: #1e293b; stroke: #ef4444; stroke-width: 1.5; rx: 12; ry: 12; }
      .card-good { fill: #1e293b; stroke: #22c55e; stroke-width: 2; rx: 12; ry: 12; }
      .header-bad { fill: #ef4444; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .header-good { fill: #22c55e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .subhead { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; }
      .code-box { fill: #0f172a; rx: 6; ry: 6; }
      .code-bad { fill: #fca5a5; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
      .code-good { fill: #86efac; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
      .label-desc { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; }
      .banner { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; ry: 8; }
      .zen-quote { fill: #fde047; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-style: italic; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" rx="16" ry="16"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" class="title">The Developer Mindset: Non-Pythonic vs Pythonic Code</text>
  <text x="480" y="60" text-anchor="middle" class="subtitle">Section 26 &amp; 27: Applying the Zen of Python (PEP 20) in Real Code</text>

  <!-- Left: Non-Pythonic -->
  <g transform="translate(50, 85)">
    <rect width="410" height="300" class="card-bad" />
    <text x="30" y="32" class="header-bad">❌ Non-Pythonic (C/Java style in Python)</text>
    <text x="30" y="52" class="subhead">Cluttered, indirect, hard to read</text>

    <!-- Example 1 -->
    <text x="30" y="80" class="label-desc">1. Swapping two variables:</text>
    <rect x="30" y="90" width="350" height="42" class="code-box" />
    <text x="40" y="116" class="code-bad">temp = a; a = b; b = temp</text>

    <!-- Example 2 -->
    <text x="30" y="152" class="label-desc">2. Iterating over items:</text>
    <rect x="30" y="162" width="350" height="52" class="code-box" />
    <text x="40" y="184" class="code-bad">for i in range(len(users)):</text>
    <text x="65" y="202" class="code-bad">print(users[i])</text>

    <!-- Example 3 -->
    <text x="30" y="234" class="label-desc">3. Checking membership:</text>
    <rect x="30" y="244" width="350" height="40" class="code-box" />
    <text x="40" y="269" class="code-bad">found = False; for u in users: ...</text>
  </g>

  <!-- Right: Pythonic -->
  <g transform="translate(500, 85)">
    <rect width="410" height="300" class="card-good" />
    <text x="30" y="32" class="header-good">✔ Pythonic (Idiomatic Python)</text>
    <text x="30" y="52" class="subhead">Expressive, readable, elegant</text>

    <!-- Example 1 -->
    <text x="30" y="80" class="label-desc">1. Tuple unpacking swap:</text>
    <rect x="30" y="90" width="350" height="42" class="code-box" />
    <text x="40" y="116" class="code-good">a, b = b, a</text>

    <!-- Example 2 -->
    <text x="30" y="152" class="label-desc">2. Direct element iteration:</text>
    <rect x="30" y="162" width="350" height="52" class="code-box" />
    <text x="40" y="184" class="code-good">for user in users:</text>
    <text x="65" y="202" class="code-good">print(user)</text>

    <!-- Example 3 -->
    <text x="30" y="234" class="label-desc">3. Natural 'in' operator:</text>
    <rect x="30" y="244" width="350" height="40" class="code-box" />
    <text x="40" y="269" class="code-good">if "Alice" in users: ...</text>
  </g>

  <!-- Bottom Zen Quote Banner -->
  <g transform="translate(50, 405)">
    <rect width="860" height="55" class="banner" />
    <text x="430" y="28" text-anchor="middle" class="zen-quote">"Beautiful is better than ugly. Simple is better than complex. Readability counts."</text>
    <text x="430" y="46" text-anchor="middle" class="subhead">— The Zen of Python (PEP 20)</text>
  </g>
</svg>
