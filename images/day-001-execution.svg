<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
      .card-highlight { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 12; ry: 12; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .badge-text { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
      .step-num { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .code { fill: #38bdf8; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
      .code-sub { fill: #a5f3fc; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
      .arrow { stroke: #38bdf8; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #38bdf8; }
      .banner-bg { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; ry: 8; }
      .banner-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .banner-desc { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" class="bg" rx="16" ry="16"/>

  <!-- Top Title Bar -->
  <text x="480" y="42" text-anchor="middle" class="title">How Python Executes a Program (From Code to CPU)</text>
  <text x="480" y="66" text-anchor="middle" class="subtitle">Mission Python 100 — Day 01 Visual Architecture</text>

  <!-- Step 1: Source Code -->
  <g transform="translate(40, 100)">
    <rect width="150" height="230" class="card" />
    <circle cx="75" cy="30" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="75" y="35" text-anchor="middle" class="step-num">1</text>
    <text x="75" y="70" text-anchor="middle" class="title" font-size="15">Source Code</text>
    <text x="75" y="90" text-anchor="middle" class="badge-text">app.py</text>
    
    <!-- Code Box -->
    <rect x="15" y="108" width="120" height="60" fill="#0f172a" rx="6" ry="6" />
    <text x="25" y="132" class="code">print(</text>
    <text x="35" y="150" class="code" fill="#fde047">"Hello"</text>
    <text x="85" y="150" class="code">)</text>
    
    <text x="75" y="192" text-anchor="middle" class="subtitle" font-size="11">Human-readable</text>
    <text x="75" y="208" text-anchor="middle" class="subtitle" font-size="11">text file on disk</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="195" y1="215" x2="225" y2="215" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 2: CPython Compiler -->
  <g transform="translate(230, 100)">
    <rect width="150" height="230" class="card" />
    <circle cx="75" cy="30" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="75" y="35" text-anchor="middle" class="step-num">2</text>
    <text x="75" y="70" text-anchor="middle" class="title" font-size="15">CPython Compiler</text>
    <text x="75" y="90" text-anchor="middle" class="badge-text">Syntax &amp; AST</text>
    
    <rect x="15" y="108" width="120" height="60" fill="#0f172a" rx="6" ry="6" />
    <text x="75" y="128" text-anchor="middle" class="code-sub">1. Lexer (Tokens)</text>
    <text x="75" y="145" text-anchor="middle" class="code-sub">2. Parser (AST)</text>
    <text x="75" y="160" text-anchor="middle" class="code-sub">3. Code Generator</text>

    <text x="75" y="192" text-anchor="middle" class="subtitle" font-size="11">Validates grammar</text>
    <text x="75" y="208" text-anchor="middle" class="subtitle" font-size="11">and syntax rules</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="385" y1="215" x2="415" y2="215" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3: Bytecode -->
  <g transform="translate(420, 100)">
    <rect width="150" height="230" class="card" />
    <circle cx="75" cy="30" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="75" y="35" text-anchor="middle" class="step-num">3</text>
    <text x="75" y="70" text-anchor="middle" class="title" font-size="15">Bytecode</text>
    <text x="75" y="90" text-anchor="middle" class="badge-text">app.cpython-312.pyc</text>
    
    <rect x="15" y="108" width="120" height="60" fill="#0f172a" rx="6" ry="6" />
    <text x="22" y="130" class="code-sub" fill="#cbd5e1">LOAD_NAME print</text>
    <text x="22" y="146" class="code-sub" fill="#cbd5e1">LOAD_CONST 'Hello'</text>
    <text x="22" y="162" class="code-sub" fill="#cbd5e1">CALL_FUNCTION</text>

    <text x="75" y="192" text-anchor="middle" class="subtitle" font-size="11">Intermediate</text>
    <text x="75" y="208" text-anchor="middle" class="subtitle" font-size="11">stack instructions</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="575" y1="215" x2="605" y2="215" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 4: Python Virtual Machine -->
  <g transform="translate(610, 100)">
    <rect width="150" height="230" class="card-highlight" />
    <circle cx="75" cy="30" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="75" y="35" text-anchor="middle" class="step-num">4</text>
    <text x="75" y="70" text-anchor="middle" class="title" font-size="15">Python Runtime</text>
    <text x="75" y="90" text-anchor="middle" class="badge-text" fill="#38bdf8">PVM (Runtime Loop)</text>
    
    <rect x="15" y="108" width="120" height="60" fill="#0f172a" rx="6" ry="6" />
    <text x="75" y="130" text-anchor="middle" class="code-sub" fill="#38bdf8">Eval Loop</text>
    <text x="75" y="146" text-anchor="middle" class="code-sub" fill="#cbd5e1">Stack Frames</text>
    <text x="75" y="162" text-anchor="middle" class="code-sub" fill="#cbd5e1">Heap Memory</text>

    <text x="75" y="192" text-anchor="middle" class="subtitle" font-size="11">Executes bytecode</text>
    <text x="75" y="208" text-anchor="middle" class="subtitle" font-size="11">one instruction at a time</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="765" y1="215" x2="795" y2="215" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 5: OS & Hardware -->
  <g transform="translate(800, 100)">
    <rect width="120" height="230" class="card" />
    <circle cx="60" cy="30" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="60" y="35" text-anchor="middle" class="step-num">5</text>
    <text x="60" y="70" text-anchor="middle" class="title" font-size="15">CPU &amp; OS</text>
    <text x="60" y="90" text-anchor="middle" class="badge-text">Execution</text>
    
    <rect x="15" y="108" width="90" height="60" fill="#0f172a" rx="6" ry="6" />
    <text x="60" y="132" text-anchor="middle" class="code-sub">Syscalls</text>
    <text x="60" y="150" text-anchor="middle" class="code-sub">CPU Cycles</text>

    <text x="60" y="192" text-anchor="middle" class="subtitle" font-size="11">Prints text to</text>
    <text x="60" y="208" text-anchor="middle" class="subtitle" font-size="11">your screen</text>
  </g>

  <!-- Bottom Key Takeaway Card -->
  <g transform="translate(40, 360)">
    <rect width="880" height="120" class="banner-bg" />
    <text x="30" y="36" class="banner-title">💡 Why this matters to you as a developer:</text>
    <text x="30" y="65" class="banner-desc">• Python does not compile directly to binary CPU machine code like C or Go.</text>
    <text x="30" y="88" class="banner-desc">• It compiles to Bytecode (.pyc), which is then interpreted by the Python Virtual Machine (PVM).</text>
    <text x="30" y="108" class="banner-desc">• This makes Python cross-platform: the same code runs on Windows, Linux, and macOS without recompiling!</text>
  </g>
</svg>
