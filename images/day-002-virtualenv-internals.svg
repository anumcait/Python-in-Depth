<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .panel-bad { fill: #1e293b; stroke: #ef4444; stroke-width: 1.5; rx: 12; ry: 12; }
      .panel-good { fill: #1e293b; stroke: #22c55e; stroke-width: 2; rx: 12; ry: 12; }
      .head-bad { fill: #ef4444; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .head-good { fill: #22c55e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .box { fill: #0f172a; stroke: #475569; stroke-width: 1; rx: 6; ry: 6; }
      .box-active { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6; ry: 6; }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; }
      .code { fill: #38bdf8; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
      .code-err { fill: #fca5a5; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
      .code-ok { fill: #86efac; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" rx="16" ry="16"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" class="title">The Why Behind Virtual Environments: Eliminating Dependency Hell</text>
  <text x="480" y="60" text-anchor="middle" class="subtitle">Global Installation vs Project-Level Virtualenv Isolation</text>

  <!-- Left: Global Conflict Problem -->
  <g transform="translate(50, 85)">
    <rect width="410" height="360" class="panel-bad" />
    <text x="30" y="35" class="head-bad">❌ Global Packages (Dependency Conflict)</text>
    <text x="30" y="55" class="text-sub">Single global site-packages folder shared by all projects</text>

    <!-- Global Python Box -->
    <g transform="translate(25, 75)">
      <rect width="360" height="110" class="box" />
      <text x="20" y="28" class="text-title">Shared Global Python (C:\Python312)</text>
      <text x="20" y="50" class="code-err">pip install pydantic==1.10   (Project A needs this)</text>
      <text x="20" y="72" class="code-err">pip install pydantic==2.6    (Overwrites Project A!)</text>
      <text x="20" y="94" class="code-err">💥 RESULT: Project A crashes with ImportError / breaking API changes</text>
    </g>

    <g transform="translate(25, 205)">
      <rect width="360" height="120" fill="#0f172a" rx="6" ry="6" />
      <text x="20" y="30" class="text-title" fill="#fca5a5">Why this breaks in production:</text>
      <text x="20" y="55" class="text-sub">• Different libraries require conflicting dependency versions.</text>
      <text x="20" y="75" class="text-sub">• Upgrading a package for one tool breaks other tools.</text>
      <text x="20" y="95" class="text-sub">• Impossible to generate a clean, accurate requirements.txt.</text>
    </g>
  </g>

  <!-- Right: Virtualenv Isolation -->
  <g transform="translate(500, 85)">
    <rect width="410" height="360" class="panel-good" />
    <text x="30" y="35" class="head-good">✔ With Isolated Virtual Environments (.venv)</text>
    <text x="30" y="55" class="text-sub">Every project has its own dedicated directory &amp; packages</text>

    <!-- Project A Box -->
    <g transform="translate(25, 75)">
      <rect width="360" height="100" class="box-active" />
      <text x="20" y="25" class="text-title" fill="#38bdf8">📁 Project A: Fashion Store (.venv_a)</text>
      <text x="20" y="48" class="code-ok">FastAPI 0.95</text>
      <text x="20" y="68" class="code-ok">Pydantic 1.10</text>
      <text x="20" y="88" class="text-sub">Runs smoothly in its own sandbox ✅</text>
    </g>

    <!-- Project B Box -->
    <g transform="translate(25, 195)">
      <rect width="360" height="100" class="box-active" />
      <text x="20" y="25" class="text-title" fill="#38bdf8">📁 Project B: AI Ride Dispatch (.venv_b)</text>
      <text x="20" y="48" class="code-ok">FastAPI 1.0.0+</text>
      <text x="20" y="68" class="code-ok">Pydantic 2.6.0+</text>
      <text x="20" y="88" class="text-sub">Runs independently with zero side effects ✅</text>
    </g>

    <text x="45" y="325" class="text-sub" fill="#86efac">✔ Clean, reproducible, Docker-ready development environments.</text>
  </g>
</svg>
