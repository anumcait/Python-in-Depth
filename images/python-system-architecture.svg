<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .layer-card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .layer-title { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .node-card { fill: #0f172a; stroke: #475569; stroke-width: 1.5; rx: 6; ry: 6; }
      .node-text { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .node-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .banner { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; ry: 8; }
      .banner-text { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" rx="16" ry="16"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" class="title">Enterprise System Architecture with Python</text>
  <text x="480" y="60" text-anchor="middle" class="subtitle">Section 31 &amp; 32: From Single Script to Production E-Commerce &amp; Ride-Booking Platforms</text>

  <!-- Layer 1: Clients -->
  <g transform="translate(50, 85)">
    <rect width="860" height="75" class="layer-card" />
    <text x="25" y="28" class="layer-title">1. Client Layer (Users &amp; Drivers)</text>
    <g transform="translate(250, 15)">
      <rect width="160" height="45" class="node-card" />
      <text x="80" y="22" text-anchor="middle" class="node-text">📱 Mobile App</text>
      <text x="80" y="38" text-anchor="middle" class="node-sub">iOS / Android (React Native/Flutter)</text>
    </g>
    <g transform="translate(440, 15)">
      <rect width="160" height="45" class="node-card" />
      <text x="80" y="22" text-anchor="middle" class="node-text">💻 Web Storefront</text>
      <text x="80" y="38" text-anchor="middle" class="node-sub">Next.js / Vue / Browser</text>
    </g>
  </g>

  <!-- Connector Down -->
  <line x1="480" y1="160" x2="480" y2="180" class="arrow" marker-end="url(#arrow)" />

  <!-- Layer 2: Python Backend Services -->
  <g transform="translate(50, 185)">
    <rect width="860" height="110" class="layer-card" stroke="#38bdf8" stroke-width="2" />
    <text x="25" y="26" class="layer-title" fill="#38bdf8">2. Python Backend Microservices (FastAPI / Django)</text>
    
    <!-- Service 1: User & Auth -->
    <g transform="translate(30, 42)">
      <rect width="145" height="52" class="node-card" stroke="#38bdf8" />
      <text x="72" y="24" text-anchor="middle" class="node-text">🔐 Auth &amp; User</text>
      <text x="72" y="40" text-anchor="middle" class="node-sub">JWT / Permissions</text>
    </g>

    <!-- Service 2: Catalog / Rides -->
    <g transform="translate(195, 42)">
      <rect width="155" height="52" class="node-card" stroke="#38bdf8" />
      <text x="77" y="24" text-anchor="middle" class="node-text">🛍️ Product Catalog</text>
      <text x="77" y="40" text-anchor="middle" class="node-sub">Fashion Items / Inventory</text>
    </g>

    <!-- Service 3: Orders / Dispatch -->
    <g transform="translate(370, 42)">
      <rect width="155" height="52" class="node-card" stroke="#38bdf8" />
      <text x="77" y="24" text-anchor="middle" class="node-text">📦 Order &amp; Cart</text>
      <text x="77" y="40" text-anchor="middle" class="node-sub">Pricing, Tax &amp; Discount</text>
    </g>

    <!-- Service 4: Geo Matching -->
    <g transform="translate(545, 42)">
      <rect width="145" height="52" class="node-card" stroke="#38bdf8" />
      <text x="72" y="24" text-anchor="middle" class="node-text">🚗 Ride Dispatch</text>
      <text x="72" y="40" text-anchor="middle" class="node-sub">Geo-Matching &amp; Fares</text>
    </g>

    <!-- Service 5: Payments -->
    <g transform="translate(710, 42)">
      <rect width="120" height="52" class="node-card" stroke="#38bdf8" />
      <text x="60" y="24" text-anchor="middle" class="node-text">💳 Payments</text>
      <text x="60" y="40" text-anchor="middle" class="node-sub">Stripe / Webhooks</text>
    </g>
  </g>

  <!-- Connector Down -->
  <line x1="480" y1="295" x2="480" y2="315" class="arrow" marker-end="url(#arrow)" />

  <!-- Layer 3: Storage & Cloud Infrastructure -->
  <g transform="translate(50, 320)">
    <rect width="860" height="80" class="layer-card" />
    <text x="25" y="28" class="layer-title">3. Data &amp; Cloud Infrastructure (PostgreSQL, Redis, AWS)</text>
    <g transform="translate(180, 20)">
      <rect width="140" height="45" class="node-card" />
      <text x="70" y="22" text-anchor="middle" class="node-text">🗄️ PostgreSQL</text>
      <text x="70" y="38" text-anchor="middle" class="node-sub">Relational Records</text>
    </g>
    <g transform="translate(340, 20)">
      <rect width="140" height="45" class="node-card" />
      <text x="70" y="22" text-anchor="middle" class="node-text">⚡ Redis Cache</text>
      <text x="70" y="38" text-anchor="middle" class="node-sub">Sessions &amp; Driver Locations</text>
    </g>
    <g transform="translate(500, 20)">
      <rect width="140" height="45" class="node-card" />
      <text x="70" y="22" text-anchor="middle" class="node-text">📨 Kafka / RabbitMQ</text>
      <text x="70" y="38" text-anchor="middle" class="node-sub">Async Events &amp; Push</text>
    </g>
    <g transform="translate(660, 20)">
      <rect width="140" height="45" class="node-card" />
      <text x="70" y="22" text-anchor="middle" class="node-text">☁️ AWS Cloud</text>
      <text x="70" y="38" text-anchor="middle" class="node-sub">Docker, ECS &amp; S3</text>
    </g>
  </g>

  <!-- Bottom Message -->
  <g transform="translate(50, 415)">
    <rect width="860" height="50" class="banner" />
    <text x="430" y="30" text-anchor="middle" class="banner-text">🚀 Day 01 Goal: You don't build this on Day 1, but you learn the engineering mindset required to architect it!</text>
  </g>
</svg>
