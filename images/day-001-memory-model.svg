<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .section-card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; ry: 12; }
      .section-header { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .var-tag { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 6; ry: 6; }
      .var-text { fill: #38bdf8; font-family: 'Consolas', 'Courier New', monospace; font-size: 16px; font-weight: bold; }
      .obj-card { fill: #0f172a; stroke: #64748b; stroke-width: 1.5; rx: 8; ry: 8; }
      .obj-card-active { fill: #0f172a; stroke: #22c55e; stroke-width: 2; rx: 8; ry: 8; }
      .obj-card-gc { fill: #0f172a; stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 8; ry: 8; }
      .obj-type { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; }
      .obj-val { fill: #f8fafc; font-family: 'Consolas', 'Courier New', monospace; font-size: 22px; font-weight: bold; }
      .arrow-active { stroke: #22c55e; stroke-width: 2.5; fill: none; }
      .arrow-old { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
      .badge-gc { fill: #ef4444; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
      .badge-ok { fill: #22c55e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
      .banner-bg { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; ry: 8; }
      .banner-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .banner-desc { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" rx="16" ry="16"/>

  <!-- Top Title -->
  <text x="480" y="38" text-anchor="middle" class="title">How Python Variables Work (Names as Object References)</text>
  <text x="480" y="60" text-anchor="middle" class="subtitle">Variables do not hold data — they point to objects in Heap Memory</text>

  <!-- Left: Namespace (Variable Names) -->
  <g transform="translate(40, 90)">
    <rect width="260" height="230" class="section-card" />
    <text x="130" y="32" text-anchor="middle" class="section-header">Variables (Names)</text>
    <text x="130" y="52" text-anchor="middle" class="subtitle" font-size="11">Stored in Local Namespace</text>

    <!-- Variable 'value' Tag -->
    <rect x="30" y="90" width="200" height="60" class="var-tag" />
    <text x="130" y="126" text-anchor="middle" class="var-text">name: value</text>
    
    <text x="130" y="195" text-anchor="middle" class="subtitle" font-size="12">A variable is just a name tag</text>
    <text x="130" y="212" text-anchor="middle" class="subtitle" font-size="12">pointing to an object.</text>
  </g>

  <!-- Center Arrow connecting to old object -->
  <path d="M 270 205 Q 360 170 450 145" class="arrow-old" marker-end="url(#arrow-red)" />
  <text x="360" y="155" text-anchor="middle" class="badge-gc">Step 1: value = 10 (broken)</text>

  <!-- Center Arrow connecting to new object -->
  <path d="M 270 215 Q 360 245 450 265" class="arrow-active" marker-end="url(#arrow-green)" />
  <text x="360" y="275" text-anchor="middle" class="badge-ok">Step 2: value = "Python" (active)</text>

  <!-- Right: Heap Memory (Objects) -->
  <g transform="translate(460, 90)">
    <rect width="460" height="230" class="section-card" />
    <text x="230" y="32" text-anchor="middle" class="section-header">Python Heap Memory (Objects)</text>
    <text x="230" y="52" text-anchor="middle" class="subtitle" font-size="11">Where data actually lives in RAM</text>

    <!-- Object 1: Integer 10 (Orphaned / GC) -->
    <g transform="translate(30, 45)">
      <rect width="180" height="150" class="obj-card-gc" />
      <text x="20" y="28" class="obj-type">Type: &lt;class 'int'&gt;</text>
      <text x="90" y="75" text-anchor="middle" class="obj-val" fill="#94a3b8">10</text>
      <line x1="20" y1="95" x2="160" y2="95" stroke="#334155" stroke-width="1" />
      <text x="90" y="115" text-anchor="middle" class="badge-gc">References: 0</text>
      <text x="90" y="133" text-anchor="middle" class="subtitle" font-size="10">Garbage Collected 🗑️</text>
    </g>

    <!-- Object 2: String 'Python' (Active) -->
    <g transform="translate(250, 45)">
      <rect width="180" height="150" class="obj-card-active" />
      <text x="20" y="28" class="obj-type" fill="#86efac">Type: &lt;class 'str'&gt;</text>
      <text x="90" y="75" text-anchor="middle" class="obj-val" fill="#22c55e">"Python"</text>
      <line x1="20" y1="95" x2="160" y2="95" stroke="#334155" stroke-width="1" />
      <text x="90" y="115" text-anchor="middle" class="badge-ok">References: 1</text>
      <text x="90" y="133" text-anchor="middle" class="subtitle" font-size="10">Currently in use ✅</text>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(40, 340)">
    <rect width="880" height="110" class="banner-bg" />
    <text x="30" y="32" class="banner-title">📌 Key Understanding from Day 01:</text>
    <text x="30" y="58" class="banner-desc">1. When you assign <tspan font-family="monospace" fill="#38bdf8">value = 10</tspan>, Python creates an integer object 10 in Heap Memory and binds the name <tspan font-family="monospace" fill="#38bdf8">value</tspan> to it.</text>
    <text x="30" y="80" class="banner-desc">2. When you later write <tspan font-family="monospace" fill="#38bdf8">value = "Python"</tspan>, the name simply moves its pointer to a new string object.</text>
    <text x="30" y="100" class="banner-desc">3. The previous number (10) now has zero references and is automatically cleaned up by Python's Garbage Collector.</text>
  </g>
</svg>
