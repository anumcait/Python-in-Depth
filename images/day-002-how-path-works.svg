<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; ry: 12; }
      .card-err { fill: #1e293b; stroke: #ef4444; stroke-width: 1.5; rx: 12; ry: 12; }
      .card-ok { fill: #1e293b; stroke: #22c55e; stroke-width: 2; rx: 12; ry: 12; }
      .head-ok { fill: #22c55e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .head-err { fill: #ef4444; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .terminal { fill: #0f172a; stroke: #475569; stroke-width: 1; rx: 6; ry: 6; }
      .cmd { fill: #f8fafc; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
      .err-text { fill: #fca5a5; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
      .ok-text { fill: #86efac; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
      .subtext { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; }
      .step-tag { fill: #38bdf8; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" rx="16" ry="16"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" class="title">Understanding the OS PATH Environment Variable</text>
  <text x="480" y="60" text-anchor="middle" class="subtitle">Why "Add python.exe to PATH" is the most crucial step during installation</text>

  <!-- Left: PATH NOT CONFIGURED -->
  <g transform="translate(50, 85)">
    <rect width="410" height="360" class="card-err" />
    <text x="30" y="35" class="head-err">❌ Without PATH Configured</text>
    <text x="30" y="55" class="subtext">OS scans system folders, fails to find python.exe</text>

    <!-- Terminal Box -->
    <rect x="25" y="75" width="360" height="110" class="terminal" />
    <text x="35" y="100" class="cmd">C:\Users\Admin&gt; python</text>
    <text x="35" y="125" class="err-text">'python' is not recognized as an internal</text>
    <text x="35" y="145" class="err-text">or external command, operable program</text>
    <text x="35" y="165" class="err-text">or batch file.</text>

    <!-- Path explanation -->
    <g transform="translate(25, 205)">
      <rect width="360" height="120" fill="#0f172a" rx="6" ry="6" />
      <text x="20" y="25" class="step-tag" fill="#ef4444">Search sequence executed by OS:</text>
      <text x="20" y="48" class="step-tag" fill="#94a3b8">1. C:\Windows\System32 ──&gt; (Not found)</text>
      <text x="20" y="70" class="step-tag" fill="#94a3b8">2. C:\Windows ───────────&gt; (Not found)</text>
      <text x="20" y="92" class="step-tag" fill="#ef4444">3. End of PATH reached ──&gt; CRASH / ERROR</text>
    </g>
  </g>

  <!-- Right: PATH PROPERLY CONFIGURED -->
  <g transform="translate(500, 85)">
    <rect width="410" height="360" class="card-ok" />
    <text x="30" y="35" class="head-ok">✔ With PATH Configured</text>
    <text x="30" y="55" class="subtext">OS matches python directory instantly</text>

    <!-- Terminal Box -->
    <rect x="25" y="75" width="360" height="110" class="terminal" />
    <text x="35" y="100" class="cmd">C:\Users\Admin&gt; python --version</text>
    <text x="35" y="125" class="ok-text">Python 3.12.2</text>
    <text x="35" y="148" class="cmd">C:\Users\Admin&gt; where python</text>
    <text x="35" y="170" class="ok-text" font-size="10">C:\Users\Admin\AppData\Local\Programs\Python\Python312\python.exe</text>

    <!-- Path explanation -->
    <g transform="translate(25, 205)">
      <rect width="360" height="120" fill="#0f172a" rx="6" ry="6" />
      <text x="20" y="25" class="step-tag" fill="#22c55e">Search sequence executed by OS:</text>
      <text x="20" y="48" class="step-tag" fill="#94a3b8">1. .venv\Scripts\ (if active)</text>
      <text x="20" y="70" class="step-tag" fill="#22c55e">2. C:\Python312\ ───────&gt; FOUND! ✅</text>
      <text x="20" y="92" class="step-tag" fill="#38bdf8">3. Launches CPython Runtime interpreter</text>
    </g>
  </g>
</svg>
