<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; ry: 12; }
      .card-active { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 12; ry: 12; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .card-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .badge { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
      .code-box { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6; ry: 6; }
      .code { fill: #38bdf8; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
      .code-green { fill: #4ade80; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
      .code-dim { fill: #64748b; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .banner { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; ry: 8; }
      .banner-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .banner-desc { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" class="bg" rx="16" ry="16"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" class="title">Professional Python Development Environment Architecture</text>
  <text x="480" y="60" text-anchor="middle" class="subtitle">Mission Python 100 — Day 02: IDE, Runtime, PATH &amp; Virtual Environment Layering</text>

  <!-- Left: VS Code IDE -->
  <g transform="translate(40, 85)">
    <rect width="270" height="320" class="card" />
    <text x="135" y="32" text-anchor="middle" class="card-title">1. Code Editor (VS Code)</text>
    <text x="135" y="52" text-anchor="middle" class="badge">DEVELOPER WORKSPACE</text>

    <!-- Editor UI Mockup -->
    <rect x="20" y="70" width="230" height="95" class="code-box" />
    <text x="32" y="92" class="code-dim"># main.py</text>
    <text x="32" y="112" class="code">import sys</text>
    <text x="32" y="132" class="code">print(sys.executable)</text>
    <text x="32" y="152" class="code-green"># Output: .venv/Scripts/python</text>

    <!-- Extensions Subcard -->
    <g transform="translate(20, 180)">
      <rect width="230" height="115" fill="#0f172a" rx="6" ry="6" />
      <text x="20" y="24" class="code-dim">Essential Extensions:</text>
      <text x="20" y="46" class="code" fill="#f8fafc">✔ Python (Microsoft)</text>
      <text x="20" y="68" class="code" fill="#f8fafc">✔ Pylance (Language Server)</text>
      <text x="20" y="90" class="code" fill="#f8fafc">✔ Python Debugger (debugpy)</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="315" y1="245" x2="355" y2="245" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Middle: OS PATH & Terminal -->
  <g transform="translate(360, 85)">
    <rect width="260" height="320" class="card" />
    <text x="130" y="32" text-anchor="middle" class="card-title">2. Terminal &amp; OS PATH</text>
    <text x="130" y="52" text-anchor="middle" class="badge">COMMAND RESOLUTION</text>

    <!-- Terminal Box -->
    <rect x="15" y="70" width="230" height="95" class="code-box" />
    <text x="25" y="92" class="code-dim">PS D:\project&gt; python --version</text>
    <text x="25" y="112" class="code-green">Python 3.12.2</text>
    <text x="25" y="135" class="code-dim">PS D:\project&gt; where python</text>
    <text x="25" y="152" class="code" font-size="10">D:\project\.venv\Scripts\python.exe</text>

    <!-- Path explanation -->
    <g transform="translate(15, 180)">
      <rect width="230" height="115" fill="#0f172a" rx="6" ry="6" />
      <text x="15" y="24" class="code-dim">OS PATH Lookup Rule:</text>
      <text x="15" y="46" class="code-green">1. Active .venv/Scripts</text>
      <text x="15" y="66" class="code-dim">2. User AppData\Programs</text>
      <text x="15" y="86" class="code-dim">3. System32 (Windows)</text>
      <text x="15" y="104" class="code-dim" font-size="10">First match executes!</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="625" y1="245" x2="665" y2="245" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Right: Virtual Environment & Packages -->
  <g transform="translate(670, 85)">
    <rect width="250" height="320" class="card-active" />
    <text x="125" y="32" text-anchor="middle" class="card-title">3. Isolated Virtualenv</text>
    <text x="125" y="52" text-anchor="middle" class="badge" fill="#38bdf8">.venv / REPRODUCIBLE</text>

    <!-- Tree Box -->
    <g transform="translate(15, 70)">
      <rect width="220" height="225" class="code-box" />
      <text x="15" y="24" class="code" fill="#fde047">📁 .venv/</text>
      <text x="25" y="46" class="code">├── 📁 Include/</text>
      <text x="25" y="68" class="code">├── 📁 Lib/</text>
      <text x="35" y="90" class="code">│   └── 📁 site-packages/</text>
      <text x="50" y="110" class="code-green">│       ├── fastapi/</text>
      <text x="50" y="128" class="code-green">│       └── requests/</text>
      <text x="25" y="150" class="code">├── 📁 Scripts/ (or bin/)</text>
      <text x="35" y="170" class="code-green">│   ├── activate.ps1</text>
      <text x="35" y="188" class="code">│   └── python.exe</text>
      <text x="25" y="210" class="code">└── 📄 pyvenv.cfg</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(40, 425)">
    <rect width="880" height="70" class="banner" />
    <text x="25" y="28" class="banner-title">🎯 The Senior Developer Mindset for Day 02:</text>
    <text x="25" y="50" class="banner-desc">Never install project dependencies into your global operating system Python. Always create a local <tspan font-family="monospace" fill="#38bdf8">.venv</tspan> per project to guarantee isolated, reproducible, and zero-conflict execution.</text>
  </g>
</svg>
